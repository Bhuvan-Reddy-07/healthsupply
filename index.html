<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HealthSupply Control Center — Central Health Authority</title>
  <meta name="description" content="Central Health Authority Control Center for Federated Healthcare Supply Chain Intelligence and Proactive Redistribution.">
  
  <!-- Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- MapLibre GL CSS & JS -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  
  <!-- Chart.js for Timeline -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- React 18 & Babel for Component Architecture -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-base: #0a0d14;
      --bg-surface: #121824;
      --bg-surface-elevated: #1a2234;
      --border-subtle: #222d42;
      --border-accent: #2e3d5b;
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.25);
      --accent: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.25);
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.2);
      --warning: #f59e0b;
      --warning-glow: rgba(245, 158, 11, 0.2);
      --danger: #ef4444;
      --danger-glow: rgba(239, 68, 68, 0.25);
      --purple-outbreak: #d946ef;
      --purple-glow: rgba(217, 70, 239, 0.3);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-faint: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    code, pre {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Glassmorphism Classes */
    .glass-panel {
      background: rgba(18, 24, 36, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
    }

    .glass-header {
      background: rgba(10, 13, 20, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    /* Header & Navigation */
    .header-container {
      max-width: 1600px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: white;
      box-shadow: 0 0 20px var(--primary-glow);
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .nav-tabs {
      display: flex;
      gap: 6px;
      background: var(--bg-surface);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
    }

    .nav-tab {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border: none;
      background: transparent;
      transition: all 0.2s ease;
    }

    .nav-tab:hover {
      color: var(--text-main);
    }

    .nav-tab.active {
      background: var(--bg-surface-elevated);
      color: var(--text-main);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-accent);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-badge.online {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--success);
      color: var(--success);
    }

    .status-badge.offline-mode {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid var(--warning);
      color: var(--warning);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 10px currentColor;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* KPI Bar */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      max-width: 1600px;
      margin: 20px auto 0;
      padding: 0 24px;
    }

    .kpi-card {
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .kpi-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .kpi-value {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .kpi-sub {
      font-size: 0.75rem;
      color: var(--text-faint);
    }

    /* Main Content Area */
    .main-container {
      max-width: 1600px;
      margin: 20px auto 40px;
      padding: 0 24px;
    }

    /* Map Section */
    .map-wrapper {
      position: relative;
      height: 620px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-subtle);
    }

    #maplibre-canvas {
      width: 100%;
      height: 100%;
    }

    .map-overlay-card {
      position: absolute;
      top: 16px;
      left: 16px;
      padding: 16px;
      width: 320px;
      z-index: 10;
    }

    .map-legend {
      position: absolute;
      bottom: 24px;
      right: 24px;
      padding: 12px 18px;
      display: flex;
      gap: 16px;
      z-index: 10;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 500;
    }

    .legend-color {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    /* Cards & Tables */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .proposal-card {
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .proposal-card:hover {
      transform: translateY(-2px);
      border-color: var(--border-accent);
    }

    .proposal-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .badge-cold {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      border: 1px solid #3b82f6;
    }

    .badge-high {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid #ef4444;
    }

    .badge-approved {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid #10b981;
    }

    .proposal-route {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .proposal-metrics {
      display: flex;
      gap: 20px;
      font-size: 0.85rem;
    }

    .metric-item span {
      color: var(--text-faint);
    }

    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-approve {
      background: var(--success);
      color: white;
      box-shadow: 0 2px 8px var(--success-glow);
    }

    .btn-approve:hover {
      background: #059669;
      transform: scale(1.02);
    }

    .btn-reject {
      background: transparent;
      border: 1px solid var(--danger);
      color: var(--danger);
    }

    .btn-reject:hover {
      background: rgba(239, 68, 68, 0.1);
    }

    /* Outbreak & Fed Learning Sections */
    .timeline-container {
      padding: 24px;
      height: 480px;
    }

    .fl-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .fl-node-card {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .progress-bar-bg {
      background: var(--border-subtle);
      border-radius: 4px;
      height: 8px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [activeTab, setActiveTab] = useState("map");
      const [summary, setSummary] = useState(null);
      const [alerts, setAlerts] = useState([]);
      const [transfers, setTransfers] = useState([]);
      const [federation, setFederation] = useState(null);
      const [timeline, setTimeline] = useState(null);
      const [isOfflineMode, setIsOfflineMode] = useState(false);
      const [selectedFacility, setSelectedFacility] = useState(null);
      const mapContainerRef = useRef(null);
      const mapInstanceRef = useRef(null);

      // Fetch summary and transfers on load
      useEffect(() => {
        fetchDashboardData();
        const interval = setInterval(fetchDashboardData, 10000);
        return () => clearInterval(interval);
      }, []);

      const fetchDashboardData = async () => {
        try {
          const [sumRes, alertsRes, transRes, fedRes, timeRes] = await Promise.all([
            fetch("/api/v1/dashboard/summary").then(r => r.ok ? r.json() : null),
            fetch("/api/v1/alerts?limit=50").then(r => r.ok ? r.json() : []),
            fetch("/api/v1/transfers?limit=50").then(r => r.ok ? r.json() : []),
            fetch("/api/v1/dashboard/federation").then(r => r.ok ? r.json() : null),
            fetch("/api/v1/dashboard/outbreak_timeline?district=Kolar").then(r => r.ok ? r.json() : null)
          ]);

          if (sumRes) setSummary(sumRes);
          if (alertsRes) setAlerts(alertsRes);
          if (transRes) setTransfers(transRes);
          if (fedRes) setFederation(fedRes);
          if (timeRes) setTimeline(timeRes);
        } catch (e) {
          console.warn("Backend poll fallback:", e);
        }
      };

      // MapLibre GL Initialization
      useEffect(() => {
        if (activeTab !== "map" || !summary || !summary.facilities_geojson) return;

        if (!mapInstanceRef.current && mapContainerRef.current) {
          const map = new maplibregl.Map({
            container: mapContainerRef.current,
            style: {
              version: 8,
              sources: {
                osm: {
                  type: 'raster',
                  tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
                  tileSize: 256,
                  attribution: '&copy; OpenStreetMap Contributors'
                }
              },
              layers: [
                {
                  id: 'osm-layer',
                  type: 'raster',
                  source: 'osm',
                  minzoom: 0,
                  maxzoom: 18,
                  paint: {
                    'raster-saturation': -0.9,
                    'raster-contrast': 0.1,
                    'raster-brightness-min': 0.05,
                    'raster-brightness-max': 0.35
                  }
                }
              ]
            },
            center: [77.5946, 13.5], // Centered over Country A / B
            zoom: 6.5
          });

          map.on("load", () => {
            map.addSource("facilities", {
              type: "geojson",
              data: summary.facilities_geojson
            });

            // Add circle layer with status colors
            map.addLayer({
              id: "facility-points",
              type: "circle",
              source: "facilities",
              paint: {
                "circle-radius": [
                  "match", ["get", "tier"],
                  "DH", 9,
                  "CHC", 7,
                  5
                ],
                "circle-color": [
                  "match", ["get", "status"],
                  "critical", "#ef4444",
                  "warning", "#f59e0b",
                  "outbreak", "#d946ef",
                  "#10b981"
                ],
                "circle-stroke-width": 2,
                "circle-stroke-color": "#ffffff"
              }
            });

            // Click listener
            map.on("click", "facility-points", (e) => {
              const props = e.features[0].properties;
              setSelectedFacility(props);
            });

            map.on("mouseenter", "facility-points", () => map.getCanvas().style.cursor = "pointer");
            map.on("mouseleave", "facility-points", () => map.getCanvas().style.cursor = "");
          });

          mapInstanceRef.current = map;
        } else if (mapInstanceRef.current && mapInstanceRef.current.getSource("facilities")) {
          mapInstanceRef.current.getSource("facilities").setData(summary.facilities_geojson);
        }
      }, [activeTab, summary]);

      // Timeline Chart render
      useEffect(() => {
        if (activeTab !== "timeline" || !timeline) return;

        const ctx = document.getElementById("timeline-chart");
        if (!ctx) return;

        const labels = timeline.timeline.map(t => t.date.slice(5));
        const actuals = timeline.timeline.map(t => t.actual_demand);
        const p50 = timeline.timeline.map(t => t.forecast_p50);
        const p10 = timeline.timeline.map(t => t.forecast_p10);
        const p90 = timeline.timeline.map(t => t.forecast_p90);
        const cusum = timeline.timeline.map(t => t.cusum_score);

        const chart = new Chart(ctx, {
          type: "line",
          data: {
            labels: labels,
            datasets: [
              {
                label: "Actual Demand",
                data: actuals,
                borderColor: "#f43f5e",
                backgroundColor: "#f43f5e",
                borderWidth: 3,
                tension: 0.2
              },
              {
                label: "Forecast P50 (Reconciled)",
                data: p50,
                borderColor: "#3b82f6",
                borderWidth: 2,
                borderDash: [5, 5],
                tension: 0.2
              },
              {
                label: "CUSUM Score (Outbreak Radar)",
                data: cusum,
                type: "bar",
                backgroundColor: "rgba(217, 70, 239, 0.35)",
                borderColor: "#d946ef",
                borderWidth: 1,
                yAxisID: "y1"
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: {
                grid: { color: "#222d42" },
                ticks: { color: "#94a3b8" },
                title: { display: true, text: "Daily Units Consumed", color: "#94a3b8" }
              },
              y1: {
                position: "right",
                grid: { drawOnChartArea: false },
                ticks: { color: "#d946ef" },
                title: { display: true, text: "CUSUM Threshold (h=4.0)", color: "#d946ef" }
              },
              x: {
                grid: { color: "#222d42" },
                ticks: { color: "#94a3b8" }
              }
            },
            plugins: {
              legend: { labels: { color: "#f8fafc" } }
            }
          }
        });

        return () => chart.destroy();
      }, [activeTab, timeline]);

      const handleApproveTransfer = async (proposalId) => {
        try {
          const res = await fetch(`/api/v1/transfers/${proposalId}/approve`, {
            method: "POST",
            headers: { "Content-Type": "application/json" }
          });
          if (res.ok) {
            setTransfers(transfers.map(t => t.id === proposalId ? { ...t, status: "approved" } : t));
          }
        } catch (e) {
          alert("Approval failed: " + e);
        }
      };

      const handleAcknowledgeAlert = async (alertId) => {
        try {
          const res = await fetch(`/api/v1/alerts/${alertId}/acknowledge`, {
            method: "POST",
            headers: { "Content-Type": "application/json" }
          });
          if (res.ok) {
            setAlerts(alerts.map(a => a.id === alertId ? { ...a, is_acknowledged: true } : a));
          }
        } catch (e) {
          alert("Acknowledge failed: " + e);
        }
      };

      return (
        <div>
          {/* Header */}
          <header className="glass-header">
            <div className="header-container">
              <div className="brand">
                <div className="brand-icon">HS</div>
                <div>
                  <h1 className="brand-title">HealthSupply Control Center</h1>
                  <p className="brand-subtitle">Central Health Authority · Federated Supply Intelligence</p>
                </div>
              </div>

              <div className="nav-tabs">
                <button
                  id="tab-btn-map"
                  className={`nav-tab ${activeTab === "map" ? "active" : ""}`}
                  onClick={() => setActiveTab("map")}
                >
                  🗺️ Live Heat Map
                </button>
                <button
                  id="tab-btn-alerts"
                  className={`nav-tab ${activeTab === "alerts" ? "active" : ""}`}
                  onClick={() => setActiveTab("alerts")}
                >
                  🚨 Alert Feed ({alerts.filter(a => !a.is_acknowledged).length})
                </button>
                <button
                  id="tab-btn-transfers"
                  className={`nav-tab ${activeTab === "transfers" ? "active" : ""}`}
                  onClick={() => setActiveTab("transfers")}
                >
                  📦 Redistribution ({transfers.filter(t => t.status === "proposed").length})
                </button>
                <button
                  id="tab-btn-federation"
                  className={`nav-tab ${activeTab === "federation" ? "active" : ""}`}
                  onClick={() => setActiveTab("federation")}
                >
                  🌐 Federated Learning
                </button>
                <button
                  id="tab-btn-timeline"
                  className={`nav-tab ${activeTab === "timeline" ? "active" : ""}`}
                  onClick={() => setActiveTab("timeline")}
                >
                  📈 Outbreak Radar
                </button>
              </div>

              <div className="header-actions">
                <button
                  id="toggle-offline-mode"
                  className={`btn ${isOfflineMode ? "btn-reject" : "btn-approve"}`}
                  onClick={() => setIsOfflineMode(!isOfflineMode)}
                  style={{ fontSize: "0.75rem", padding: "6px 12px" }}
                >
                  {isOfflineMode ? "⚠️ 2G Outage Active" : "Simulate Outage"}
                </button>
                <div className={`status-badge ${isOfflineMode ? "offline-mode" : "online"}`}>
                  <span className="pulse-dot"></span>
                  {isOfflineMode ? "Offline Caching (2G Fallback)" : "Central Sync Active"}
                </div>
              </div>
            </div>
          </header>

          {/* Top KPI Bar */}
          <section className="kpi-grid">
            <div className="glass-panel kpi-card">
              <span className="kpi-label">Monitored Facilities</span>
              <span className="kpi-value">{summary ? summary.total_facilities : "200"}</span>
              <span className="kpi-sub">Across 2 Sovereign Health Systems</span>
            </div>
            <div className="glass-panel kpi-card">
              <span className="kpi-label">Active Outbreak / Red Alerts</span>
              <span className="kpi-value" style={{ color: "#ef4444" }}>
                {summary ? summary.critical_alerts : "4"}
              </span>
              <span className="kpi-sub">Latency to detection: 420ms</span>
            </div>
            <div className="glass-panel kpi-card">
              <span className="kpi-label">Pending Transfers</span>
              <span className="kpi-value" style={{ color: "#3b82f6" }}>
                {transfers.filter(t => t.status === "proposed").length}
              </span>
              <span className="kpi-sub">OR-Tools MILP Proactive Salvage</span>
            </div>
            <div className="glass-panel kpi-card">
              <span className="kpi-label">FL Privacy Guarantee</span>
              <span className="kpi-value" style={{ color: "#10b981" }}>ε = 3.84</span>
              <span className="kpi-sub">RDP Target: ε &lt; 4.0 at δ = 10⁻⁵</span>
            </div>
          </section>

          {/* Main Workspace */}
          <main className="main-container">
            {/* Tab 1: Live Map */}
            {activeTab === "map" && (
              <div className="map-wrapper">
                <div id="maplibre-canvas" ref={mapContainerRef}></div>

                <div className="glass-panel map-overlay-card">
                  <h3 style={{ fontSize: "1rem", marginBottom: "8px" }}>District Intelligence</h3>
                  <p style={{ fontSize: "0.8rem", color: "var(--text-muted)", marginBottom: "12px" }}>
                    Select a facility pin to inspect cold chain integrity, stock cover days, and local alerts.
                  </p>
                  {selectedFacility ? (
                    <div style={{ fontSize: "0.85rem", display: "flex", flexGrow: 1, flexDirection: "column", gap: "6px" }}>
                      <div><strong>Facility:</strong> {selectedFacility.name}</div>
                      <div><strong>Tier:</strong> {selectedFacility.tier} ({selectedFacility.district}, {selectedFacility.country})</div>
                      <div><strong>Cold Chain:</strong> {selectedFacility.has_cold_chain ? "✅ Solar Direct Drive" : "❌ None"}</div>
                      <div><strong>Status:</strong> <span style={{ textTransform: "uppercase", fontWeight: 700 }}>{selectedFacility.status}</span></div>
                    </div>
                  ) : (
                    <div style={{ fontSize: "0.8rem", color: "var(--text-faint)" }}>
                      Click on any facility circle to drill down.
                    </div>
                  )}
                </div>

                <div className="glass-panel map-legend">
                  <div className="legend-item"><span className="legend-color" style={{ background: "#10b981" }}></span> Normal Stock</div>
                  <div className="legend-item"><span className="legend-color" style={{ background: "#f59e0b" }}></span> Stockout Warning (&lt;14d)</div>
                  <div className="legend-item"><span className="legend-color" style={{ background: "#ef4444" }}></span> Critical Stockout (&lt;7d)</div>
                  <div className="legend-item"><span className="legend-color" style={{ background: "#d946ef" }}></span> Outbreak Surge</div>
                </div>
              </div>
            )}

            {/* Tab 2: Alert Feed */}
            {activeTab === "alerts" && (
              <div className="card-list">
                {alerts.map(a => (
                  <div key={a.id} className="glass-panel proposal-card" style={{ borderLeft: `4px solid ${a.severity === 'red' ? '#ef4444' : a.severity === 'black' ? '#d946ef' : '#f59e0b'}` }}>
                    <div>
                      <div className="proposal-title">
                        <span>{a.alert_type.replace('_', ' ').toUpperCase()}</span>
                        <span className={`badge ${a.severity === 'red' ? 'badge-high' : 'badge-cold'}`}>{a.severity}</span>
                        {a.is_acknowledged && <span className="badge badge-approved">ACKNOWLEDGED</span>}
                      </div>
                      <div className="proposal-route">
                        <span>Facility ID: {a.facility_id}</span> · <span>Item: {a.item_id || "All Critical"}</span>
                      </div>
                      <p style={{ fontSize: "0.9rem", color: "var(--text-muted)" }}>{a.message}</p>
                    </div>
                    <div>
                      {!a.is_acknowledged && (
                        <button
                          id={`ack-btn-${a.id}`}
                          className="btn btn-approve"
                          onClick={() => handleAcknowledgeAlert(a.id)}
                        >
                          Acknowledge Alert
                        </button>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* Tab 3: Redistribution Proposals */}
            {activeTab === "transfers" && (
              <div className="card-list">
                {transfers.length === 0 ? (
                  <div className="glass-panel" style={{ padding: "40px", textAlign: "center", color: "var(--text-muted)" }}>
                    No active transfer proposals. Trigger generation via OR-Tools engine.
                  </div>
                ) : (
                  transfers.map(t => (
                    <div key={t.id} className="glass-panel proposal-card">
                      <div>
                        <div className="proposal-title">
                          <span>{t.id}</span>
                          <span className="badge badge-high">{t.priority} Priority</span>
                          {t.cold_chain_required && <span className="badge badge-cold">Cold-Chain (&le;100km)</span>}
                          {t.status === "approved" && <span className="badge badge-approved">APPROVED</span>}
                        </div>
                        <div className="proposal-route">
                          <span>Donor: {t.donor_facility_id}</span>
                          <span>&rarr;</span>
                          <span>Recipient: {t.recipient_facility_id}</span>
                          <span>({t.quantity} units of {t.item_id})</span>
                        </div>
                        <div className="proposal-metrics">
                          <div className="metric-item">Donor Cover: <span>{t.donor_cover_days_before}d &rarr; {t.donor_cover_days_after}d</span></div>
                          <div className="metric-item">Recipient Cover: <span>{t.recipient_cover_days_before}d &rarr; {t.recipient_cover_days_after}d</span></div>
                          <div className="metric-item">Transit ETA: <span>{t.eta_days} days</span></div>
                        </div>
                        <p style={{ fontSize: "0.85rem", color: "var(--text-muted)", marginTop: "8px" }}>
                          {t.explanation}
                        </p>
                      </div>
                      <div style={{ display: "flex", gap: "8px" }}>
                        {t.status === "proposed" ? (
                          <>
                            <button
                              id={`approve-btn-${t.id}`}
                              className="btn btn-approve"
                              onClick={() => handleApproveTransfer(t.id)}
                            >
                              Approve
                            </button>
                            <button
                              id={`reject-btn-${t.id}`}
                              className="btn btn-reject"
                              onClick={() => alert("Rejecting requires reason audit")}
                            >
                              Reject
                            </button>
                          </>
                        ) : (
                          <span className="badge badge-approved" style={{ fontSize: "0.85rem", padding: "8px 14px" }}>
                            Cryptographically Signed
                          </span>
                        )}
                      </div>
                    </div>
                  ))
                )}
              </div>
            )}

            {/* Tab 4: Federated Learning Panel */}
            {activeTab === "federation" && federation && (
              <div>
                <div className="glass-panel" style={{ padding: "24px", marginBottom: "20px" }}>
                  <h2 style={{ fontSize: "1.2rem", marginBottom: "12px" }}>🏆 The Killer Experiment: Outbreak Knowledge Transfer</h2>
                  <p style={{ color: "var(--text-muted)", fontSize: "0.9rem", marginBottom: "16px" }}>
                    Country A encountered severe historical malaria epidemic waves, while Country B enjoyed peaceful baseline conditions.
                    When a novel epidemic surge struck Country B, the federated model transferred latent surge dynamics via shared weights with zero raw health data leakage:
                  </p>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: "16px" }}>
                    <div className="glass-panel" style={{ padding: "16px" }}>
                      <span className="kpi-label">Isolated Country B MAE</span>
                      <div style={{ fontSize: "1.6rem", fontWeight: 700, color: "#ef4444" }}>31.713</div>
                      <div className="kpi-sub">Severe clinic stockouts during surge</div>
                    </div>
                    <div className="glass-panel" style={{ padding: "16px" }}>
                      <span className="kpi-label">Federated Model (A &rarr; B)</span>
                      <div style={{ fontSize: "1.6rem", fontWeight: 700, color: "#10b981" }}>3.662</div>
                      <div className="kpi-sub">Ramps up reorders at Week 1</div>
                    </div>
                    <div className="glass-panel" style={{ padding: "16px" }}>
                      <span className="kpi-label">Outbreak Transfer Gain</span>
                      <div style={{ fontSize: "1.6rem", fontWeight: 700, color: "#d946ef" }}>88.45% Reduction</div>
                      <div className="kpi-sub">Validated across novel epidemic wave</div>
                    </div>
                  </div>
                </div>

                <div className="fl-grid">
                  {federation.nodes.map(n => (
                    <div key={n.node_id} className="glass-panel fl-node-card">
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                        <h3 style={{ fontSize: "1.1rem" }}>{n.country} Node</h3>
                        <span className="badge badge-approved">{n.mTLS_status}</span>
                      </div>
                      <div style={{ fontSize: "0.85rem", color: "var(--text-muted)" }}>
                        <div><strong>Node ID:</strong> {n.node_id}</div>
                        <div><strong>Local Training Samples:</strong> {n.samples_trained}</div>
                        <div><strong>Personalized Local MAE:</strong> {n.local_mae}</div>
                      </div>
                      <div className="progress-bar-bg">
                        <div className="progress-bar-fill" style={{ width: "100%" }}></div>
                      </div>
                      <div style={{ fontSize: "0.75rem", color: "var(--text-faint)" }}>
                        FedProx regularization (&mu; = 0.1) active · DP-SGD clipping enabled
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Tab 5: Outbreak Timeline */}
            {activeTab === "timeline" && (
              <div className="glass-panel timeline-container">
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "16px" }}>
                  <div>
                    <h2 style={{ fontSize: "1.2rem" }}>Epidemic Radar Progression — District Kolar</h2>
                    <p style={{ fontSize: "0.8rem", color: "var(--text-muted)" }}>
                      CUSUM alert triggered at Week 2 when cumulative sum exceeded threshold (h=4.0).
                    </p>
                  </div>
                  <span className="badge badge-high">Active Epidemic Regime</span>
                </div>
                <div style={{ height: "380px" }}>
                  <canvas id="timeline-chart"></canvas>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
