<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HealthSupply Control Center — Central Health Authority</title>
  <meta name="description" content="Central Health Authority Control Center for Federated Healthcare Supply Chain Intelligence, Outbreak Radar Surveillance, and Proactive Redistribution.">
  
  <!-- Modern Inter & JetBrains Mono Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- MapLibre GL CSS & JS v3.6.2 -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  
  <!-- Chart.js for High-Fidelity Time Series -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- React 18 & Babel for Component Architecture -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* ==========================================================================
       DESIGN SYSTEM: RESTRAINED SEMANTIC PALETTE & 3-TIER ELEVATION
       ========================================================================== */
    :root {
      /* Backgrounds & Surfaces */
      --bg-base: #0B1220;
      --bg-surface: #111C30;
      --bg-elevated: #16243D;
      --bg-overlay: rgba(17, 28, 48, 0.92);
      
      /* Borders */
      --border-subtle: #1E2D4A;
      --border-accent: #2C426B;
      --border-focus: #38BDF8;

      /* Semantic Risk Colors (Restrained, High-Contrast) */
      --emerald: #10B981;
      --emerald-bg: rgba(16, 185, 129, 0.12);
      --emerald-glow: rgba(16, 185, 129, 0.25);
      
      --amber: #F59E0B;
      --amber-bg: rgba(245, 158, 11, 0.12);
      --amber-glow: rgba(245, 158, 11, 0.25);

      --rose: #F43F5E;
      --rose-bg: rgba(244, 63, 94, 0.15);
      --rose-glow: rgba(244, 63, 94, 0.35);

      --violet: #A855F7;
      --violet-bg: rgba(168, 85, 247, 0.16);
      --violet-glow: rgba(168, 85, 247, 0.35);

      --sky: #38BDF8;
      --sky-bg: rgba(56, 189, 248, 0.12);
      --sky-glow: rgba(56, 189, 248, 0.25);

      /* Typography & Text */
      --text-primary: #F8FAFC;
      --text-secondary: #CBD5E1;
      --text-muted: #94A3B8;
      --text-faint: #64748B;

      /* Radii */
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    code, pre, .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Tabular numbers to prevent jitter on live telemetry updates */
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    /* Accessibility focus rings */
    :focus-visible {
      outline: 2px solid var(--border-focus);
      outline-offset: 2px;
    }

    /* 3-Tier Elevation Classes */
    .panel-base {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
    }

    .panel-elevated {
      background: var(--bg-elevated);
      border: 1px solid var(--border-accent);
      border-radius: var(--radius-md);
    }

    .panel-glass {
      background: var(--bg-overlay);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-accent);
      border-radius: var(--radius-md);
    }

    /* ==========================================================================
       TOP BAR
       ========================================================================== */
    .topbar {
      background: rgba(11, 18, 32, 0.95);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .topbar-content {
      max-width: 1720px;
      margin: 0 auto;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, #2563EB, #7C3AED);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.05rem;
      color: white;
      box-shadow: 0 0 16px rgba(37, 99, 235, 0.4);
    }

    .brand-title-wrap h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .brand-title-wrap p {
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.03em;
      text-transform: uppercase;
      font-weight: 500;
    }

    .nav-tabs {
      display: flex;
      gap: 4px;
      background: rgba(17, 28, 48, 0.8);
      padding: 4px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
    }

    .nav-tab {
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border: none;
      background: transparent;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-tab:hover {
      color: var(--text-primary);
    }

    .nav-tab.active {
      background: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-accent);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .privacy-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--emerald-bg);
      border: 1px solid var(--emerald);
      color: var(--emerald);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .status-pill.online {
      background: var(--emerald-bg);
      border: 1px solid var(--emerald);
      color: var(--emerald);
    }

    .status-pill.offline {
      background: var(--amber-bg);
      border: 1px solid var(--amber);
      color: var(--amber);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }

    /* ==========================================================================
       DEMO TIMELINE RIBBON (STORY STEPPER)
       ========================================================================== */
    .demo-ribbon {
      background: #0E1626;
      border-bottom: 1px solid var(--border-subtle);
      padding: 6px 20px;
    }

    .stepper-container {
      max-width: 1720px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .stepper-label {
      font-size: 0.7rem;
      color: var(--text-faint);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    .stepper-steps {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-grow: 1;
      justify-content: center;
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(17, 28, 48, 0.6);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .step-item:hover {
      color: var(--text-primary);
      border-color: var(--border-accent);
    }

    .step-item.active {
      color: var(--text-primary);
      background: var(--bg-elevated);
      border-color: var(--sky);
      box-shadow: 0 0 10px var(--sky-glow);
    }

    .step-num {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--border-accent);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 700;
    }

    .step-item.active .step-num {
      background: var(--sky);
      color: #0B1220;
    }

    .step-divider {
      color: var(--text-faint);
      font-size: 0.65rem;
    }

    /* ==========================================================================
       COMMAND CENTER 3-COLUMN WORKSPACE
       ========================================================================== */
    .workspace-grid {
      max-width: 1720px;
      margin: 14px auto 30px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 58% 42%;
      gap: 16px;
    }

    @media (max-width: 1200px) {
      .workspace-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Left: Map Container */
    .map-column {
      position: relative;
      height: 740px;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border-subtle);
    }

    #maplibre-canvas {
      width: 100%;
      height: 100%;
    }

    .map-overlay-card {
      position: absolute;
      top: 14px;
      left: 14px;
      width: 320px;
      padding: 14px;
      z-index: 10;
    }

    .map-legend {
      position: absolute;
      bottom: 14px;
      right: 14px;
      padding: 8px 14px;
      display: flex;
      gap: 12px;
      z-index: 10;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    /* Right: Stack Column */
    .stack-column {
      display: flex;
      flex-direction: column;
      gap: 14px;
      height: 740px;
      overflow-y: auto;
      padding-right: 4px;
    }

    /* Custom thin scrollbar */
    .stack-column::-webkit-scrollbar {
      width: 6px;
    }
    .stack-column::-webkit-scrollbar-thumb {
      background: var(--border-accent);
      border-radius: 3px;
    }

    /* KPI Hero Strip */
    .kpi-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .kpi-box {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      position: relative;
      overflow: hidden;
    }

    .kpi-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 3px;
      height: 100%;
      background: var(--sky);
    }

    .kpi-box.emerald::before { background: var(--emerald); }
    .kpi-box.amber::before { background: var(--amber); }
    .kpi-box.rose::before { background: var(--rose); }
    .kpi-box.violet::before { background: var(--violet); }

    .kpi-title {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .kpi-val {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-primary);
      line-height: 1.1;
    }

    .kpi-meta {
      font-size: 0.68rem;
      color: var(--text-faint);
    }

    /* Split Section: Outbreak Curve + Killer Experiment */
    .analytics-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .chart-box {
      padding: 12px 14px;
      height: 230px;
      display: flex;
      flex-direction: column;
    }

    .chart-box-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .chart-box-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .killer-box {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      background: linear-gradient(145deg, rgba(17, 28, 48, 0.95), rgba(168, 85, 247, 0.08));
      border: 1px solid rgba(168, 85, 247, 0.3);
    }

    .killer-box-badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      background: var(--violet-bg);
      color: var(--violet);
      border: 1px solid var(--violet);
      padding: 2px 6px;
      border-radius: 4px;
      align-self: flex-start;
      margin-bottom: 6px;
    }

    .killer-stat-big {
      font-size: 2.1rem;
      font-weight: 800;
      color: var(--violet);
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .killer-desc {
      font-size: 0.72rem;
      color: var(--text-muted);
      line-height: 1.35;
    }

    /* Right Rail Feeds: Alerts & Redistribution */
    .feed-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      flex-grow: 1;
      min-height: 250px;
    }

    .feed-column {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .feed-header {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .feed-scroll {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 260px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .feed-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .feed-scroll::-webkit-scrollbar-thumb {
      background: var(--border-accent);
      border-radius: 2px;
    }

    /* Cards with Micro-interactions */
    .mini-card {
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      transition: transform 0.15s ease, border-color 0.15s ease;
      animation: slideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .mini-card:hover {
      transform: translateY(-1px);
      border-color: var(--border-accent);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(12px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .mini-card.border-rose {
      border-left: 3px solid var(--rose);
    }

    .mini-card.border-violet {
      border-left: 3px solid var(--violet);
    }

    .mini-card.border-amber {
      border-left: 3px solid var(--amber);
    }

    .mini-card-title {
      font-size: 0.78rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2px;
    }

    .mini-card-sub {
      font-size: 0.7rem;
      color: var(--text-muted);
      line-height: 1.3;
    }

    /* Buttons */
    .btn {
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.75rem;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-approve {
      background: var(--emerald);
      color: #0B1220;
    }

    .btn-approve:hover {
      background: #059669;
      transform: translateY(-1px);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border-accent);
      color: var(--text-secondary);
    }

    .btn-outline:hover {
      background: var(--bg-elevated);
      color: var(--text-primary);
    }

    /* Proposal Cover Days Dual-Bar */
    .cover-bar-wrap {
      margin-top: 6px;
      background: #0A0F1A;
      padding: 6px;
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
    }

    .cover-bar-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .cover-bar-meter {
      height: 4px;
      background: var(--border-subtle);
      border-radius: 2px;
      overflow: hidden;
      display: flex;
    }

    .cover-bar-fill {
      height: 100%;
      transition: width 0.4s ease;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badge-rose {
      background: var(--rose-bg);
      color: var(--rose);
      border: 1px solid var(--rose);
    }

    .badge-amber {
      background: var(--amber-bg);
      color: var(--amber);
      border: 1px solid var(--amber);
    }

    .badge-violet {
      background: var(--violet-bg);
      color: var(--violet);
      border: 1px solid var(--violet);
    }

    .badge-emerald {
      background: var(--emerald-bg);
      color: var(--emerald);
      border: 1px solid var(--emerald);
    }

    .badge-sky {
      background: var(--sky-bg);
      color: var(--sky);
      border: 1px solid var(--sky);
    }

    /* Full tab views */
    .full-tab-container {
      max-width: 1720px;
      margin: 14px auto 40px;
      padding: 0 20px;
    }

    /* Counterfactual Benchmark Table */
    .benchmark-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      margin-top: 14px;
    }

    .benchmark-table th {
      text-align: left;
      padding: 10px 14px;
      background: var(--bg-surface);
      color: var(--text-muted);
      font-weight: 600;
      border-bottom: 1px solid var(--border-subtle);
    }

    .benchmark-table td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-secondary);
    }

    .benchmark-table tr:hover td {
      background: var(--bg-elevated);
      color: var(--text-primary);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, info) {
        console.error("Dashboard error caught by boundary:", error, info);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div style={{ padding: "40px", color: "#F8FAFC", background: "#0B1220", fontFamily: "Inter, sans-serif", minHeight: "100vh" }}>
              <h2 style={{ color: "#F43F5E", marginBottom: "12px" }}>Control Center Telemetry Notice</h2>
              <p style={{ color: "#CBD5E1", marginBottom: "16px" }}>{String(this.state.error?.message || this.state.error)}</p>
              <button 
                onClick={() => window.location.reload()} 
                style={{ padding: "8px 16px", background: "#38BDF8", border: "none", borderRadius: "6px", color: "#0B1220", fontWeight: "bold", cursor: "pointer" }}
              >
                Reload Dashboard
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function App() {
      const [activeTab, setActiveTab] = useState("map");
      const [summary, setSummary] = useState({
        total_facilities: 200,
        critical_alerts: 4,
        pending_transfers: 1,
        approved_transfers: 0,
        facilities_geojson: { type: "FeatureCollection", features: [] }
      });
      const [alerts, setAlerts] = useState([
        {
          id: "ALT-SURGE-01",
          facility_id: "FAC-A-001",
          item_id: "MED_MALARIA_01",
          alert_type: "outbreak_detected",
          severity: "red",
          days_remaining: 2.2,
          p_stockout_before_lead: 0.98,
          message: "Imminent stockout warning: Epidemic surge detected in District Kolar. Demand increased 4.2x.",
          is_acknowledged: false
        }
      ]);
      const [transfers, setTransfers] = useState([
        {
          id: "PROP-633558DF",
          donor_facility_id: "FAC-A-015",
          recipient_facility_id: "FAC-A-001",
          item_id: "MED_MALARIA_01",
          quantity: 675.0,
          priority: "high",
          donor_cover_days_before: 112.5,
          donor_cover_days_after: 61.9,
          recipient_cover_days_before: 2.2,
          recipient_cover_days_after: 36.0,
          cold_chain_required: true,
          eta_days: 1.5,
          status: "proposed"
        }
      ]);
      const [federation, setFederation] = useState({
        total_nodes: 2,
        privacy: { epsilon: 3.84 },
        accuracy_comparison: [
          { model: "Isolated Local", avg_mae: 18.134, avg_wape: "55.2%" },

                            <div className="mini-card-title">
                              <span>{t.id}</span>
                              <span className="badge badge-emerald tabular-nums">{t.quantity} Units</span>
                            </div>
                            <div className="mini-card-sub">
                              {t.donor_facility_id} &rarr; {t.recipient_facility_id} (28.5 km)
                            </div>

                            {/* Dual Cover Days Comparison Bar */}
                            <div className="cover-bar-wrap">
                              <div className="cover-bar-row">
                                <span>Donor Stock Buffer:</span>
                                <span className="tabular-nums" style={{ color: "var(--emerald)" }}>
                                  {t.donor_cover_days_before}d &rarr; {t.donor_cover_days_after}d (Protected)
                                </span>
                              </div>
                              <div className="cover-bar-meter">
                                <div className="cover-bar-fill" style={{ width: "65%", background: "var(--emerald)" }}></div>
                              </div>

                              <div className="cover-bar-row" style={{ marginTop: "4px" }}>
                                <span>Recipient Cover:</span>
                                <span className="tabular-nums" style={{ color: "var(--sky)" }}>
                                  {t.recipient_cover_days_before}d &rarr; {t.recipient_cover_days_after}d (Averted)
                                </span>
                              </div>
                              <div className="cover-bar-meter">
                                <div className="cover-bar-fill" style={{ width: "85%", background: "var(--sky)" }}></div>
                              </div>
                            </div>

                            <div style={{ marginTop: "8px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                              <span className="badge badge-sky" style={{ fontSize: "0.65rem" }}>
                                Cold-Chain &le;100km
                              </span>

                              {t.status === "proposed" ? (
                                <button
                                  id={`approve-btn-${t.id}`}
                                  className="btn btn-approve"
                                  onClick={() => handleApproveTransfer(t.id)}
                                >
                                  ✓ Approve
                                </button>
                              ) : (
                                <span className="badge badge-emerald font-mono" style={{ fontSize: "0.68rem" }}>
                                  Sealed: {tamperHashSnippet || "efe4b5...6135"}
                                </span>
                              )}
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                </div>
              </div>
            </main>
          )}

          {/* =================================================================
              TAB 2: FULL-SCREEN ALERT QUEUE
              ================================================================= */}
          {activeTab === "alerts" && (
            <main className="full-tab-container">
              <div className="panel-base" style={{ padding: "20px" }}>
                <h2 style={{ fontSize: "1.2rem", marginBottom: "14px", display: "flex", alignItems: "center", gap: "10px" }}>
                  <span>🚨 Priority Alert Stream</span>
                  <span className="badge badge-rose">Real-Time Ingestion</span>
                </h2>
                <div style={{ display: "flex", flexDirection: "column", gap: "10px" }}>
                  {alerts.map(a => (
                    <div key={a.id} className="panel-elevated" style={{ padding: "14px 18px", borderLeft: `4px solid ${a.severity === 'red' ? '#F43F5E' : a.severity === 'black' ? '#A855F7' : '#F59E0B'}` }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                        <div>
                          <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                            <strong style={{ fontSize: "0.95rem" }}>{a.alert_type.replace('_', ' ').toUpperCase()}</strong>
                            <span className={`badge ${a.severity === 'red' ? 'badge-rose' : 'badge-amber'}`}>{a.severity}</span>
                            {a.is_acknowledged && <span className="badge badge-emerald">Acknowledged</span>}
                          </div>
                          <div style={{ fontSize: "0.8rem", color: "var(--text-muted)", marginTop: "4px" }}>
                            Facility: {a.facility_id} · Stock Cover: {a.days_remaining} days remaining · P(Stockout): {(a.p_stockout_before_lead * 100).toFixed(0)}%
                          </div>
                          <p style={{ fontSize: "0.85rem", color: "var(--text-secondary)", marginTop: "6px" }}>{a.message}</p>
                        </div>
                        <div>
                          {!a.is_acknowledged && (
                            <button
                              id={`ack-btn-${a.id}`}
                              className="btn btn-approve"
                              onClick={() => handleAcknowledgeAlert(a.id)}
                            >
                              Acknowledge Alert
                            </button>
                          )}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </main>
          )}

          {/* =================================================================
              TAB 3: FULL-SCREEN REDISTRIBUTION & AUDIT LOG
              ================================================================= */}
          {activeTab === "transfers" && (
            <main className="full-tab-container">
              <div className="panel-base" style={{ padding: "20px" }}>
                <h2 style={{ fontSize: "1.2rem", marginBottom: "14px", display: "flex", alignItems: "center", gap: "10px" }}>
                  <span>📦 OR-Tools MILP Redistribution Queue</span>
                  <span className="badge badge-emerald">Optimal Surplus-to-Deficit Transfers</span>
                </h2>
                <div style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
                  {transfers.map(t => (
                    <div key={t.id} className="panel-elevated" style={{ padding: "16px 20px" }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                        <div>
                          <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
                            <strong style={{ fontSize: "1rem" }}>{t.id}</strong>
                            <span className="badge badge-rose">{t.priority} Priority</span>
                            {t.cold_chain_required && <span className="badge badge-sky">Cold-Chain (&le;100km)</span>}
                            {t.status === "approved" && <span className="badge badge-emerald">Cryptographically Signed</span>}
                          </div>
                          <div style={{ fontSize: "0.85rem", color: "var(--text-muted)", margin: "6px 0" }}>
                            Route: <strong>{t.donor_facility_id}</strong> &rarr; <strong>{t.recipient_facility_id}</strong> ({t.quantity} units of Artemether-Lumefantrine)
                          </div>
                          <div style={{ display: "flex", gap: "20px", fontSize: "0.8rem", color: "var(--text-secondary)" }}>
                            <div>Donor Cover: <strong>{t.donor_cover_days_before}d &rarr; {t.donor_cover_days_after}d</strong> (Floor Protected)</div>
                            <div>Recipient Cover: <strong>{t.recipient_cover_days_before}d &rarr; {t.recipient_cover_days_after}d</strong> (Stockout Averted)</div>
                            <div>ETA: <strong>{t.eta_days} days</strong></div>
                          </div>
                        </div>

                        <div>
                          {t.status === "proposed" ? (
                            <button
                              id={`approve-btn-${t.id}`}
                              className="btn btn-approve"
                              onClick={() => handleApproveTransfer(t.id)}
                            >
                              ✓ Approve Transfer
                            </button>
                          ) : (
                            <span className="badge badge-emerald font-mono" style={{ padding: "8px 12px", fontSize: "0.75rem" }}>
                              SHA-256: efe4b5...6135
                            </span>
                          )}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </main>
          )}

          {/* =================================================================
              TAB 4: FEDERATED LEARNING & OUTBREAK TRANSFER PANEL
              ================================================================= */}
          {activeTab === "federation" && federation && (
            <main className="full-tab-container">
              <div className="panel-base" style={{ padding: "24px", marginBottom: "20px" }}>
                <h2 style={{ fontSize: "1.25rem", marginBottom: "8px" }}>
                  🏆 The Killer Experiment: Cross-Border Outbreak Knowledge Transfer
                </h2>
                <p style={{ color: "var(--text-muted)", fontSize: "0.85rem", marginBottom: "16px" }}>
                  Country A observed historical epidemic waves, while Country B had zero historical outbreak experience.
                  Under HealthSupply's FedProx framework, only model parameters traversed the wire (DP-SGD ε=3.84), cutting Country B prediction error by 88.45%:
                </p>

                <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: "14px", marginBottom: "20px" }}>
                  <div className="panel-elevated" style={{ padding: "16px" }}>
                    <span className="kpi-title">Isolated Country B (Local Head)</span>
                    <div className="tabular-nums" style={{ fontSize: "1.8rem", fontWeight: 800, color: "var(--rose)" }}>31.713</div>
                    <div style={{ fontSize: "0.72rem", color: "var(--text-faint)" }}>Blind to epidemic dynamics; severe clinic stockouts</div>
                  </div>
                  <div className="panel-elevated" style={{ padding: "16px" }}>
                    <span className="kpi-title">Federated Model (A &rarr; B)</span>
                    <div className="tabular-nums" style={{ fontSize: "1.8rem", fontWeight: 800, color: "var(--emerald)" }}>3.662</div>
                    <div style={{ fontSize: "0.72rem", color: "var(--text-faint)" }}>Learned latent surge rate; safety stock pre-ordered</div>
                  </div>
                  <div className="panel-elevated" style={{ padding: "16px" }}>
                    <span className="kpi-title">Epidemic Knowledge Gain</span>
                    <div className="tabular-nums" style={{ fontSize: "1.8rem", fontWeight: 800, color: "var(--violet)" }}>88.45% Reduction</div>
                    <div style={{ fontSize: "0.72rem", color: "var(--text-faint)" }}>Verified across novel epidemic wave</div>
                  </div>
                </div>

                {/* 4-Model Benchmark Table */}
                <h3 style={{ fontSize: "0.95rem", color: "var(--text-primary)", marginBottom: "8px" }}>
                  Model Configuration Ablation Matrix
                </h3>
                <table className="benchmark-table">
                  <thead>
                    <tr>
                      <th>Configuration</th>
                      <th>Avg MAE</th>
                      <th>Avg WAPE</th>
                      <th>Privacy Guarantee</th>
                      <th>Data Sovereignty</th>
                    </tr>
                  </thead>
                  <tbody>
                    {federation.accuracy_comparison.map(m => (
                      <tr key={m.model}>
                        <td><strong>{m.model}</strong></td>
                        <td className="tabular-nums">{m.avg_mae}</td>
                        <td className="tabular-nums">{m.avg_wape}</td>
                        <td><span className="badge badge-emerald">RDP ε=3.84</span></td>
                        <td><span className="badge badge-sky">Zero Raw Data Shared</span></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </main>
          )}

          {/* =================================================================
              TAB 5: FULL-SCREEN OUTBREAK RADAR SURVEILLANCE
              ================================================================= */}
          {activeTab === "timeline" && (
            <main className="full-tab-container">
              <div className="panel-base" style={{ padding: "24px" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "16px" }}>
                  <div>
                    <h2 style={{ fontSize: "1.2rem" }}>CUSUM Outbreak Radar Surveillance — District Kolar</h2>
                    <p style={{ fontSize: "0.8rem", color: "var(--text-muted)" }}>
                      Detects non-random demand surges at Week 2 when cumulative standardized residuals cross threshold h=4.0.
                    </p>
                  </div>
                  <span className="badge badge-violet">Active Epidemic Regime</span>
                </div>
                <div style={{ height: "420px" }}>
                  <canvas id="timeline-chart"></canvas>
                </div>
              </div>
            </main>
          )}
        </div>
      );
    }

    const rootElement = document.getElementById("root");
    if (ReactDOM.createRoot) {
      ReactDOM.createRoot(rootElement).render(
        <ErrorBoundary>
          <App />
        </ErrorBoundary>
      );
    } else {
      ReactDOM.render(
        <ErrorBoundary>
          <App />
        </ErrorBoundary>,
        rootElement
      );
    }
  </script>
</body>
</html>
